# NeviSec feed sources
#
# snippet_words = 0  ->  headline + link only, no excerpt at all.
# Use 0 for any source whose licence is non-commercial or restrictive.
#
# LEGAL NOTE (read before adding a source):
#   AP v. Meltwater (SDNY 2013) held that reproducing an article's opening
#   paragraph is NOT fair use, even with attribution and a link. Most RSS
#   <description> fields ARE the opening paragraph. That is why the default
#   cap here is 25 words and why Phase 5 replaces excerpts entirely with
#   our own summaries. Do not raise these numbers without reading that case.

[defaults]
snippet_words = 25
timeout       = 20
user_agent    = "NeviSec/0.1 (+https://github.com/VigneshN08/nevisec; feed aggregator; contact: nemmikantivignesh17@gmail.com)"

# ---------------------------------------------------------------------------
# News — excerpt-bearing feeds. Snippets capped hard.
# ---------------------------------------------------------------------------

