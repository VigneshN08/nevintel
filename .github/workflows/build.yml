name: build

# ---------------------------------------------------------------------------
# Cadence
#   Minute 37, not 0. GitHub's own docs: scheduled runs "can be delayed during
#   periods of high loads" and "some queued jobs may be dropped" -- and the top
#   of the hour is the worst offender because that is when everyone else's cron
#   fires. Treat two hours as a target, not a guarantee; the site footer shows
#   the real last-build time rather than the schedule.
#
#   workflow_dispatch is here so a dropped run can be kicked manually or by an
#   external pinger (cron-job.org, a Cloudflare Worker cron) hitting the API.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "corpus/corpus.db"
      - "data/site.json"
      - "corpus/http-cache.json"
      - "README.md"

# Least privilege by default; each job asks for exactly what it needs.
permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # commit the refreshed corpus back to the repo
      pages: write
      id-token: write
    steps:
      # Every third-party action is pinned to a full commit SHA, never a tag.
      # GitHub: pinning to a SHA "is currently the only way to use an action as
      # an immutable release." Tags are mutable -- that is exactly how
      # tj-actions/changed-files (CVE-2025-30066) was exploited across ~23,000
      # repositories in March 2025.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r pipeline/requirements.txt

      - name: Fetch feeds
        run: python pipeline/fetch.py

      - name: Render content
        run: python pipeline/render.py

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30fa514d70980904180c33313a3c # v3.0.0
        with:
          hugo-version: "0.148.2"
          extended: true

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --gc --baseURL "${{ steps.pages.outputs.base_url }}"

      # Pagefind runs against the built output, not the source. It chunks the
      # index by term, so a visitor downloads two or three ~40 KB segments
      # regardless of how large the archive gets.
      - name: Build search index
        run: npx --yes pagefind@1.3.0 --site public

      - name: Commit refreshed corpus
        run: |
          git config user.name  "nevisec-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f because .gitignore excludes these so a fresh clone starts
          # empty; CI is the only thing that should ever commit them.
          git add -f corpus/corpus.db data/site.json corpus/http-cache.json
          if git diff --staged --quiet; then
            echo "No corpus change."
          else
            git commit -m "corpus: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
        # This commit is also what keeps the scheduled workflow alive: GitHub
        # auto-disables scheduled workflows on public repos after 60 days with
        # no repository activity.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
