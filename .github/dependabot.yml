version: 2
updates:
  # Actions are SHA-pinned, so Dependabot is how pins get reviewed and bumped
  # deliberately rather than drifting.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/pipeline"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
